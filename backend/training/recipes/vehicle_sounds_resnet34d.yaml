# Receta declarativa para entrenamiento de clasificación acústica de vehículos
# Dataset: Vehicle Sounds Dataset (Kaggle: janboubiabderrahim/vehicle-sounds-dataset)

experiment_id: "exp-vehicles-resnet34d-v1"
model_id: "vehicle-sounds-resnet34d"
model_name: "Vehicle Sounds ResNet34d"
description: "Clasificador acústico de vehículos (8 clases) entrenado con GeM Pooling y Focal Loss"
epochs: 10
batch_size: 16
seed: 42
device: "cuda"

architecture:
  type: "resnet34d"
  pretrained: true
  in_chans: 1
  drop_rate: 0.3
  pool_type: "gem"

audio:
  target_sr: 32000
  duration_seconds: 3.0
  n_mels: 128
  n_fft: 1024
  hop_length: 512
  f_min: 20.0
  f_max: 16000.0
  use_gpu_frontend: true

augmentation:
  mixup_prob: 0.5
  mixup_alpha: 0.2
  spec_augment_prob: 0.5
  time_shift_prob: 0.5
  gain_prob: 0.5

loss:
  name: "focal"
  gamma: 2.0

optimizer:
  name: "adamw"
  lr: 0.001
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 2

dataset:
  metadata_csv: "data/vehicles/train_metadata.csv"
  raw_dir: "data/vehicles"
  cache_windows: true
  num_workers: 4
  pin_memory: true

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_state: 42
